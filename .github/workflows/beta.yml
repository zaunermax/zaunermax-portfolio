# Checks every pull request; deploys beta.zaunermax.at on every push to main once the
# checks pass. There are no preview deployments.
name: Beta

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: beta
      url: https://beta.zaunermax.at
    # One deploy at a time; a newer push waits rather than cancelling a running one. The
    # queue is not ordered, so each run checks below that it still deploys main's head.
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    steps:
      # A first attempt for a superseded commit skips, so a slow older run cannot overwrite a
      # newer deploy. Re-running a run is deliberate and deploys its commit anyway (rollback).
      - name: Check that main has not moved on
        id: head
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ] || [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: main is now at ${head::7}, which its own run deploys."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.head.outputs.deploy
        uses: actions/checkout@v5
      - if: steps.head.outputs.deploy
        uses: pnpm/action-setup@v4
      - if: steps.head.outputs.deploy
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.head.outputs.deploy
        run: pnpm install --frozen-lockfile
      - if: steps.head.outputs.deploy
        run: pnpm build
      - name: Deploy
        if: steps.head.outputs.deploy
        run: >-
          pnpm exec wrangler deploy --message "${GITHUB_SHA::7} ${{ github.event_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6894de59445d940fd8982eb1159d2836
