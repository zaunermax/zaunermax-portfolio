# Checks every pull request. Deploys happen on Cloudflare: Workers Builds deploys beta on
# every push to main (see the README's deployment section).
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
