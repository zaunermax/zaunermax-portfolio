allowBuilds:
  '@vercel/speed-insights': true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Allow the explicitly requested latest releases, including same-day publications.
minimumReleaseAge: 0
overrides:
  # Sanity's editor pins an older hook shim without React 19 peer support.
  use-sync-external-store: 1.7.0
  # Patched, API-compatible versions of dependencies pinned by Sanity's CLI toolchain.
  '@vercel/frameworks>js-yaml': 3.15.2
  '@vercel/frameworks>smol-toml': 1.9.1
  'typeid-js>uuid': 11.1.1
  'undici@>=7.0.0 <7.30.1': ^7.30.1
